# MoveIt Servo (Jazzy), nur Abweichungen von den Defaults
move_group_name: ur5e_arm
command_in_type: speed_units
command_out_type: trajectory_msgs/JointTrajectory
command_out_topic: /scaled_joint_trajectory_controller/joint_trajectory
publish_joint_velocities: true
publish_period: 0.005
is_primary_planning_scene_monitor: false

# Obergrenzen bei speed_units
scale:
  linear: 0.25      # max. m/s
  rotational: 0.8   # max. rad/s